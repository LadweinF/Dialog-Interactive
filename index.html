<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dialogue</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<meta name="theme-color" content="#FFF7E8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dialogue">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{
    --ink:#2E2A3A;
    --paper:#FFF7E8;
    --muted:#756E82;
    --font-display:"Chalkboard SE","Marker Felt","Comic Sans MS",system-ui,sans-serif;
    --font-ui:"Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;padding:0;
    overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:100%;
  }

  body{
    background-color:var(--paper);
    background-image:radial-gradient(rgba(46,42,58,.07) 1.5px,transparent 1.5px);
    background-size:26px 26px;
    font-family:var(--font-ui);
    color:var(--ink);
    touch-action:pan-y;
  }

  button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;}

  .app{
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---------- header ---------- */
  header{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:16px;
    width:100%;max-width:1400px;margin:0 auto;
    padding:18px 24px 8px;
  }
  h1{
    margin:0;
    font-family:var(--font-display);
    font-size:clamp(24px,3.2vw,35px);font-weight:400;line-height:1.15;
    letter-spacing:.5px;
  }
  .hint{margin:4px 0 0;color:var(--muted);font-size:clamp(16px,1.8vw,20px);}

  .qr-btn{
    flex:0 0 auto;width:58px;height:58px;
    display:flex;align-items:center;justify-content:center;
    background:#fff;
    border:3px solid var(--ink);border-radius:16px;
    box-shadow:0 4px 0 var(--ink);
    transition:transform .1s ease;
  }
  .qr-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
  .qr-btn svg{width:30px;height:30px;}

  .tools{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:6px;}

  .gear-btn{
    width:52px;height:52px;padding:0;
    display:flex;align-items:center;justify-content:center;
    background:transparent;border:0;
    opacity:.35;
    touch-action:none;
    transition:opacity .2s ease;
  }
  .gear-btn svg{width:28px;height:28px;transition:transform .15s ease;}
  .gear-btn.holding{opacity:1;}
  .gear-btn.holding svg{transform:rotate(120deg);transition:transform .8s linear;}

  .gear-hint{
    position:absolute;top:100%;right:0;margin-top:6px;z-index:6;
    padding:6px 12px;
    background:var(--ink);color:#fff;
    font-size:14px;font-weight:600;white-space:nowrap;
    border-radius:999px;
    opacity:0;transform:translateY(-4px);
    transition:opacity .2s ease,transform .2s ease;
    pointer-events:none;
  }
  .gear-hint.show{opacity:1;transform:translateY(0);}

  /* ---------- scene: child | bubbles | child ---------- */
  /* sized in em: the script sets the one font size of .scene that fits */
  .scene{
    flex:1 1 auto;min-height:0;
    overflow-x:hidden;overflow-y:auto;
    display:grid;
    grid-template-columns:minmax(0,22%) minmax(0,1fr) minmax(0,22%);
    grid-template-rows:1fr;
    grid-template-areas:"left lines right";
    column-gap:16px;
    width:100%;max-width:1400px;margin:0 auto;
    padding:.3em 24px .9em;
    font-size:24px;
  }
  #personLeft{grid-area:left;}
  #personRight{grid-area:right;}
  .lines{grid-area:lines;}
  /* auto margins centre without pushing a long dialogue off the top */
  .person,.lines{margin-top:auto;margin-bottom:auto;}

  .person{
    margin-left:0;margin-right:0;
    display:flex;flex-direction:column;align-items:center;
    transition:opacity .25s ease,filter .25s ease;
  }
  .sprite{width:6.6em;height:10em;max-width:100%;}
  .sprite > svg,.sprite > img{display:block;width:100%;height:100%;object-fit:contain;}
  .person.talking .sprite:not(.shop){animation:hop .45s ease-in-out infinite alternate;}
  .shop .kid{transform-box:fill-box;transform-origin:50% 100%;}
  .person.talking .shop .kid{animation:hop .45s ease-in-out infinite alternate;}
  .shop text{font-family:var(--font-display);}
  .sprite.shop{width:8.6em;height:12.9em;}
  .person{justify-content:flex-end;}
  .scene.has-shop .person{height:12.9em;}
  @keyframes hop{
    from{transform:translateY(0) rotate(-1.5deg);}
    to{transform:translateY(-8px) rotate(1.5deg);}
  }
  .scene.busy .person:not(.talking){opacity:.55;filter:saturate(.6);}

  .mouth-open{opacity:0;}
  .person.talking .mouth-shut{opacity:0;}
  .person.talking .mouth-open{
    opacity:1;
    transform-box:fill-box;transform-origin:center;
    animation:chatter .16s ease-in-out infinite alternate;
  }
  @keyframes chatter{
    from{transform:scaleY(.3);}
    to{transform:scaleY(1);}
  }

  /* ---------- speech bubbles ---------- */
  .lines{
    position:relative;
    list-style:none;padding:0;
    display:flex;flex-direction:column;gap:.6em;
  }
  .lines.has-arrow{padding-right:1.5em;}
  .lines li{display:flex;}
  .lines li.left{justify-content:flex-start;padding-left:.45em;}
  .lines li.right{justify-content:flex-end;padding-right:.45em;}
  .lines li.bonus-start{margin-top:.7em;}

  .bubble{
    position:relative;max-width:90%;
    display:flex;align-items:center;gap:.5em;
    padding:.45em .85em .45em .45em;
    background:var(--c-light);
    border:3px solid var(--c);border-radius:1em;
    font-family:var(--font-display);
    font-size:1em;line-height:1.3;text-align:left;
    box-shadow:0 .18em 0 var(--c-dark);
    transition:transform .15s ease,opacity .2s ease,box-shadow .15s ease;
  }
  .bubble::after{
    content:"";position:absolute;bottom:.55em;
    width:.7em;height:.7em;
    background:var(--c-light);
    border:3px solid var(--c);
    transform:rotate(45deg);
  }
  .left .bubble::after{left:-.45em;border-top:0;border-right:0;}
  .right .bubble::after{right:-.45em;border-bottom:0;border-left:0;}
  .bubble:active{transform:scale(.97);}
  .bubble .word{font-weight:700;}
  .bubble.playing{transform:scale(1.04);box-shadow:0 .18em 0 var(--c-dark),0 0 0 .28em var(--c-glow);}
  .scene.busy .bubble:not(.playing){opacity:.5;}
  .bubble.silent,.scene.busy .bubble.silent{opacity:.38;}

  .speaker{
    flex:0 0 auto;width:1.7em;height:1.7em;
    display:flex;align-items:center;justify-content:center;
    background:var(--c);border-radius:999px;
  }
  .speaker svg{width:.95em;height:.95em;}

  .star{
    position:absolute;top:-.65em;
    width:1.35em;height:1.35em;
    pointer-events:none;
  }
  .left .star{right:-.5em;}
  .right .star{left:-.5em;}
  .star svg{display:block;width:100%;height:100%;}

  .arrows{
    position:absolute;left:0;top:0;
    overflow:visible;
    pointer-events:none;
  }

  .playing .wave{animation:wave .9s infinite;}
  .playing .wave2{animation-delay:.3s;}
  @keyframes wave{
    0%,100%{opacity:.15;}
    50%{opacity:1;}
  }

  .status{
    position:fixed;left:14px;bottom:calc(6px + env(safe-area-inset-bottom));
    font-size:10px;letter-spacing:.9px;
    opacity:.45;
    pointer-events:none;
  }

  /* ---------- share sheet ---------- */
  .sheet{
    position:fixed;top:0;right:0;bottom:0;left:0;z-index:9000;
    display:none;align-items:center;justify-content:center;
    background:rgba(46,42,58,.55);
    padding:20px;
  }
  .sheet.open{display:flex;}
  .sheet-inner{
    position:relative;
    max-width:92vw;max-height:92vh;overflow:auto;
    padding:26px 28px 20px;
    background:#fff;color:var(--ink);text-align:center;
    border:3px solid var(--ink);border-radius:28px;
    box-shadow:0 8px 0 var(--ink);
  }
  .sheet h2{margin:0 0 12px;font-family:var(--font-display);font-size:27px;font-weight:400;}
  .qr-card{display:flex;justify-content:center;padding:10px;background:#fff;}
  .qr-card svg{display:block;width:min(380px,70vw,58vh);height:auto;}
  .url-line{
    margin:12px 0 0;
    font-size:15px;color:var(--muted);word-break:break-all;
    -webkit-user-select:text;user-select:text;
  }
  .close-btn{
    position:absolute;top:10px;right:10px;
    width:44px;height:44px;
    background:#fff;
    font-size:20px;font-weight:700;line-height:1;
    border:3px solid var(--ink);border-radius:999px;
  }
  .empty-note{max-width:320px;margin:10px auto;font-size:17px;opacity:.7;}

  /* ---------- settings sheet ---------- */
  .pick{
    display:flex;flex-direction:column;gap:6px;
    width:min(320px,76vw);margin:16px auto 0;
    text-align:left;
  }
  .pick span{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;opacity:.65;}
  .pick select{
    font-family:var(--font-ui);font-size:19px;font-weight:600;
    color:var(--ink);background:var(--paper);
    border:3px solid var(--ink);border-radius:12px;
    padding:10px 12px;
    appearance:none;-webkit-appearance:none;
    text-align:center;
  }

  @media (orientation:portrait){
    /* the empty first and last rows centre the group, and shrink when needed */
    .scene{
      grid-template-columns:1fr 1fr;
      grid-template-rows:minmax(0,1fr) auto auto minmax(0,1fr);
      grid-template-areas:". ." "left right" "lines lines" ". .";
    }
    .person{margin:0;}
    .lines{margin:.5em 0 0;}
    .sprite{width:4.3em;height:6.5em;}
    .sprite.shop{width:5.6em;height:8.4em;}
    .scene.has-shop .person{height:8.4em;}
  }

  @media (max-width:620px){
    header{padding:14px 16px 6px;}
    .scene{padding-left:16px;padding-right:16px;}
    .bubble{max-width:94%;}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div>
      <h1 id="title"></h1>
      <p class="hint">&#128070; Tap a speech bubble and listen!</p>
    </div>
    <div class="tools">
      <button class="gear-btn" id="gearBtn" aria-label="Settings (hold)">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2E2A3A" stroke-width="2" stroke-linejoin="round">
          <path d="M10.3 2.8h3.4l.5 2.4a7.3 7.3 0 0 1 1.9 1.1l2.3-.8 1.7 2.9-1.8 1.6a7.4 7.4 0 0 1 0 2.2l1.8 1.6-1.7 2.9-2.3-.8a7.3 7.3 0 0 1-1.9 1.1l-.5 2.4h-3.4l-.5-2.4a7.3 7.3 0 0 1-1.9-1.1l-2.3.8-1.7-2.9 1.8-1.6a7.4 7.4 0 0 1 0-2.2L3.9 8.4l1.7-2.9 2.3.8a7.3 7.3 0 0 1 1.9-1.1z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
      <div class="gear-hint" id="gearHint">Hold to open</div>
      <button class="qr-btn" id="shareBtn" aria-label="Show QR code">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2E2A3A" stroke-width="2" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/>
          <rect x="3" y="14" width="7" height="7" rx="1.2"/>
          <rect x="5.8" y="5.8" width="1.4" height="1.4" fill="#2E2A3A"/><rect x="16.8" y="5.8" width="1.4" height="1.4" fill="#2E2A3A"/>
          <rect x="5.8" y="16.8" width="1.4" height="1.4" fill="#2E2A3A"/>
          <path d="M14 14h3v3h-3zM21 14v1M14 21h1M18 21h3v-3" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="scene" id="scene">
    <figure class="person" id="personLeft"></figure>
    <ol class="lines" id="lines"></ol>
    <figure class="person" id="personRight"></figure>
  </main>

  <div class="status" id="status">v19</div>

</div>

<div class="sheet" id="settingsSheet">
  <div class="sheet-inner">
    <button class="close-btn" id="settingsClose" aria-label="Close">&#10005;</button>
    <h2>Settings</h2>
    <label class="pick"><span>Main dialogue</span><select id="pickMain"></select></label>
    <label class="pick"><span>Bonus dialogue &#9733;</span><select id="pickBonus"></select></label>
  </div>
</div>

<div class="sheet" id="shareSheet">
  <div class="sheet-inner">
    <button class="close-btn" id="shareClose" aria-label="Close">&#10005;</button>
    <h2>Scan me!</h2>
    <div class="qr-card" id="qrCard"></div>
    <p class="url-line" id="urlLine"></p>
  </div>
</div>

<audio id="player" preload="none" playsinline></audio>

<script>
/* Minimal QR encoder - byte mode, EC level L/M, versions 1-15. */

var QR = (function(){
  "use strict";

  var TOTAL = [0,26,44,70,100,134,172,196,242,292,346,404,466,532,581,655];

  // [ecPerBlock, g1Blocks, g1Data, g2Blocks, g2Data]
  var BLOCKS = {
    L: [null,[7,1,19,0,0],[10,1,34,0,0],[15,1,55,0,0],[20,1,80,0,0],[26,1,108,0,0],
        [18,2,68,0,0],[20,2,78,0,0],[24,2,97,0,0],[30,2,116,0,0],[18,2,68,2,69],
        [20,4,81,0,0],[24,2,92,2,93],[26,4,107,0,0],[30,3,115,1,116],[22,5,87,1,88]],
    M: [null,[10,1,16,0,0],[16,1,28,0,0],[26,1,44,0,0],[18,2,32,0,0],[24,2,43,0,0],
        [16,4,27,0,0],[18,4,31,0,0],[22,2,38,2,39],[22,3,36,2,37],[26,4,43,1,44],
        [30,1,50,4,51],[22,6,36,2,37],[22,8,37,1,38],[24,4,40,5,41],[24,5,41,5,42]]
  };

  var ALIGN = [null,[],[6,18],[6,22],[6,26],[6,30],[6,34],
               [6,22,38],[6,24,42],[6,26,46],[6,28,50],[6,30,54],[6,32,58],
               [6,34,62],[6,26,46,66],[6,26,48,70]];

  var REMAINDER = [0,0,7,7,7,7,7,0,0,0,0,0,0,0,3,3];

  var ECBITS = { L:1, M:0 };   // 2-bit EC indicator

  /* ---- GF(256) ---- */
  var EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (function(){
    var x = 1;
    for (var i = 0; i < 255; i++){
      EXP[i] = x;
      LOG[x] = i;
      x <<= 1;
      if (x & 0x100) x ^= 0x11D;
    }
    for (var j = 255; j < 512; j++) EXP[j] = EXP[j-255];
  })();

  function mul(a,b){ return (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]]; }

  function genPoly(deg){
    var p = [1];
    for (var i = 0; i < deg; i++){
      var np = new Array(p.length + 1).fill(0);
      for (var j = 0; j < p.length; j++){
        np[j]   ^= p[j];
        np[j+1] ^= mul(p[j], EXP[i]);
      }
      p = np;
    }
    return p;
  }

  function ecBytes(data, n){
    var gen = genPoly(n);
    var res = new Array(data.length + n).fill(0);
    for (var i = 0; i < data.length; i++) res[i] = data[i];
    for (var i = 0; i < data.length; i++){
      var f = res[i];
      if (f === 0) continue;
      for (var j = 0; j < gen.length; j++) res[i+j] ^= mul(gen[j], f);
    }
    return res.slice(data.length);
  }

  /* ---- bit stream ---- */
  function Bits(){ this.a = []; }
  Bits.prototype.put = function(v, n){
    for (var i = n - 1; i >= 0; i--) this.a.push((v >>> i) & 1);
  };

  function pickVersion(len, ec){
    for (var v = 1; v <= 15; v++){
      var b = BLOCKS[ec][v];
      var dataBytes = b[1]*b[2] + b[3]*b[4];
      var cciBits = v < 10 ? 8 : 16;
      var need = 4 + cciBits + len*8;
      if (need <= dataBytes * 8) return v;
    }
    return -1;
  }

  function buildCodewords(bytes, version, ec){
    var b = BLOCKS[ec][version];
    var ecLen = b[0], totalData = b[1]*b[2] + b[3]*b[4];
    var cciBits = version < 10 ? 8 : 16;

    var bs = new Bits();
    bs.put(4, 4);
    bs.put(bytes.length, cciBits);
    for (var i = 0; i < bytes.length; i++) bs.put(bytes[i], 8);

    var cap = totalData * 8;
    var term = Math.min(4, cap - bs.a.length);
    bs.put(0, term);
    while (bs.a.length % 8 !== 0) bs.a.push(0);

    var data = [];
    for (var i = 0; i < bs.a.length; i += 8){
      var v = 0;
      for (var j = 0; j < 8; j++) v = (v << 1) | bs.a[i+j];
      data.push(v);
    }
    var pads = [0xEC, 0x11], k = 0;
    while (data.length < totalData) data.push(pads[k++ % 2]);

    // split into blocks
    var blocks = [], pos = 0, spec = [];
    for (var i = 0; i < b[1]; i++) spec.push(b[2]);
    for (var i = 0; i < b[3]; i++) spec.push(b[4]);

    for (var i = 0; i < spec.length; i++){
      var d = data.slice(pos, pos + spec[i]);
      pos += spec[i];
      blocks.push({ d:d, e:ecBytes(d, ecLen) });
    }

    var out = [];
    var maxD = Math.max.apply(null, spec);
    for (var i = 0; i < maxD; i++)
      for (var j = 0; j < blocks.length; j++)
        if (i < blocks[j].d.length) out.push(blocks[j].d[i]);
    for (var i = 0; i < ecLen; i++)
      for (var j = 0; j < blocks.length; j++) out.push(blocks[j].e[i]);

    if (out.length !== TOTAL[version]) throw new Error("codeword count " + out.length);
    return out;
  }

  /* ---- matrix ---- */
  function makeMatrix(version){
    var n = version * 4 + 17;
    var m = [], r = [];
    for (var i = 0; i < n; i++){
      m.push(new Int8Array(n).fill(-1));
      r.push(new Uint8Array(n));
    }

    function finder(cx, cy){
      for (var dy = -1; dy <= 7; dy++)
        for (var dx = -1; dx <= 7; dx++){
          var x = cx + dx, y = cy + dy;
          if (x < 0 || y < 0 || x >= n || y >= n) continue;
          var on = (dx >= 0 && dx <= 6 && (dy === 0 || dy === 6)) ||
                   (dy >= 0 && dy <= 6 && (dx === 0 || dx === 6)) ||
                   (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4);
          m[y][x] = on ? 1 : 0;
          r[y][x] = 1;
        }
    }
    finder(0,0); finder(n-7,0); finder(0,n-7);

    // timing
    for (var i = 8; i < n-8; i++){
      m[6][i] = (i % 2 === 0) ? 1 : 0; r[6][i] = 1;
      m[i][6] = (i % 2 === 0) ? 1 : 0; r[i][6] = 1;
    }

    // alignment
    var ap = ALIGN[version];
    for (var a = 0; a < ap.length; a++)
      for (var b2 = 0; b2 < ap.length; b2++){
        var cx = ap[a], cy = ap[b2];
        var corner = (cx === 6 && cy === 6) ||
                     (cx === 6 && cy === n-7) ||
                     (cx === n-7 && cy === 6);
        if (corner) continue;
        for (var dy = -2; dy <= 2; dy++)
          for (var dx = -2; dx <= 2; dx++){
            var on = Math.max(Math.abs(dx), Math.abs(dy)) !== 1;
            m[cy+dy][cx+dx] = on ? 1 : 0;
            r[cy+dy][cx+dx] = 1;
          }
      }

    // dark module + format reserve
    m[n-8][8] = 1; r[n-8][8] = 1;
    for (var i = 0; i <= 8; i++){
      if (!r[8][i]){ r[8][i] = 1; m[8][i] = 0; }
      if (!r[i][8]){ r[i][8] = 1; m[i][8] = 0; }
    }
    for (var i = n-8; i < n; i++){
      if (!r[8][i]){ r[8][i] = 1; m[8][i] = 0; }
      if (!r[i][8]){ r[i][8] = 1; m[i][8] = 0; }
    }

    // version info reserve (v7+)
    if (version >= 7){
      for (var i = 0; i < 6; i++)
        for (var j = 0; j < 3; j++){
          r[i][n-11+j] = 1; m[i][n-11+j] = 0;
          r[n-11+j][i] = 1; m[n-11+j][i] = 0;
        }
    }

    return { m:m, r:r, n:n };
  }

  function placeData(mx, cw, version){
    var m = mx.m, r = mx.r, n = mx.n;
    var bits = [];
    for (var i = 0; i < cw.length; i++)
      for (var j = 7; j >= 0; j--) bits.push((cw[i] >>> j) & 1);

    arrowLayer.setAttribute("height", 0);
  }

  /* offsets, not screen positions: a bubble growing while it plays must not
     bend the arrow */
  function drawArrows(){
    clearArrows();
    if (!hasArrow) return;
    var em   = parseFloat(getComputedStyle(linesBox).fontSize);
    var w    = linesBox.clientWidth, h = linesBox.clientHeight;
    var lane = w - 0.75 * em;
    var r    = 0.5 * em;
    var head = 0.5 * em;
    var out  = "";

    arrowLayer.setAttribute("width", w);
    arrowLayer.setAttribute("height", h);

    LINES.forEach(function(line){
      var to = line.backTo && LINES[line.backTo - 1];
      if (!to) return;
      var a = line.el, b = to.el;
      var x0 = a.offsetLeft + a.offsetWidth + 0.05 * em, y0 = a.offsetTop + 0.5 * em;
      var x1 = b.offsetLeft + b.offsetWidth + 0.2 * em,  y1 = b.offsetTop + b.offsetHeight / 2;
      var up = y1 < y0 ? -1 : 1;
      out += '<path d="M' + x0 + ' ' + y0 +
             ' H' + (lane - r) +
             ' Q' + lane + ' ' + y0 + ' ' + lane + ' ' + (y0 + up * r) +
             ' V' + (y1 - up * r) +
             ' Q' + lane + ' ' + y1 + ' ' + (lane - r) + ' ' + y1 +
             ' H' + (x1 + head * 0.8) + '" fill="none" stroke="#2E2A3A" stroke-width="' + (0.16 * em) +
             '" stroke-linecap="round" stroke-linejoin="round"/>';
      out += '<path d="M' + x1 + ' ' + y1 +
             ' L' + (x1 + head) + ' ' + (y1 - head * 0.75) +
             ' L' + (x1 + head) + ' ' + (y1 + head * 0.75) + ' Z" fill="#2E2A3A"/>';
    });
    arrowLayer.innerHTML = out;
  }

  /* ---------- spoken lines ---------- */

  var current = -1;

  function markSilent(i){
    LINES[i].silent = true;
    LINES[i].el.classList.add("silent");
  }

  /* audio/ first, then next to index.html - a GET, as offline only a GET
     reaches the kept copy */
  function locate(name, done){
    var inFolder = "./audio/" + name + ".mp3";
    var beside   = "./" + name + ".mp3";
    fetch(inFolder)
      .then(function(r){
        if (r.ok){ done(inFolder); return; }
        throw new Error("not in the audio folder");
      })
      .catch(function(){
        return fetch(beside).then(function(r){ done(r.ok ? beside : null); });
      })
      .catch(function(){ done(null); });
  }

  /* settled before any tap, so play() always runs inside the gesture */
  function findClip(line, i){
    var name = line.clipNow;
    locate(name, function(url){
      if (line.clipNow !== name) return;         /* something else was picked meanwhile */
      if (url) line.src = url;
      else markSilent(i);
    });
  }

  function findClips(){
    LINES.forEach(function(line, i){ findClip(line, i); });
  }

  function allClipNames(){
    var names = {};
    LINES.forEach(function(line){
      Object.keys(ITEMS).forEach(function(key){ names[fillIn(line.clip, key, true)] = true; });
    });
    return Object.keys(names);
  }

  /* every recording once, so switching works offline too */
  function keepAllClips(then){
    var names = allClipNames(), left = names.length;
    names.forEach(function(name){
      locate(name, function(){ if (--left === 0 && then) setTimeout(then, 800); });
    });
  }

  function mark(i){
    if (current >= 0) LINES[current].el.classList.remove("playing");
    Array.prototype.forEach.call(document.querySelectorAll(".person.talking"), function(el){
      el.classList.remove("talking");
    });
    current = i;
    scene.classList.toggle("busy", i >= 0);
    if (i < 0) return;
    LINES[i].el.classList.add("playing");
    PEOPLE[LINES[i].who].el.classList.add("talking");
    LINES[i].el.scrollIntoView({ block:"nearest", behavior:"smooth" });
  }

  function stop(){
    player.pause();
    mark(-1);
  }

  function playLine(i){
    var line = LINES[i];
    if (!line || line.silent) return;
    player.pause();
    mark(i);
    try {
      player.src = line.src;
      var p = player.play();
      if (p && p.catch) p.catch(function(err){
        if (err && err.name === "AbortError") return;        /* another tap came first */
        if (err && err.name === "NotAllowedError"){ stop(); return; }
        clipFailed(i);
      });
    } catch (e){ clipFailed(i); }
  }

  /* a missing clip reports twice (error event and play()) */
  function clipFailed(i){
    if (LINES[i].silent) return;
    markSilent(i);
    if (i === current) stop();
  }

  player.addEventListener("ended", stop);
  player.addEventListener("error", function(){ if (current >= 0) clipFailed(current); });

  linesBox.addEventListener("click", function(e){
    var b = e.target.closest(".bubble");
    if (!b) return;
    var i = +b.getAttribute("data-line");
    if (LINES[i].silent) return;
    if (i === current) stop();
    else playLine(i);
  });

  /* ---------- settings: hold the gear for a second ---------- */

  var gearBtn       = document.getElementById("gearBtn");
  var settingsSheet = document.getElementById("settingsSheet");
  var pickMain      = document.getElementById("pickMain");
  var pickBonus     = document.getElementById("pickBonus");
  var HOLD_MS       = 800;
  var STORE         = "dialogue-choice";
  var holdTimer     = null;

  function itemLabel(key){
    var it = ITEMS[key];
    return it.words.replace(/[\[\]]/g, "").replace(/^(a|an) /, "") + " (£" + it.price + ")";
  }

  function fillPicker(sel){
    Object.keys(ITEMS).forEach(function(key){
      var o = document.createElement("option");
      o.value = key;
      o.textContent = itemLabel(key);
      sel.appendChild(o);
    });
  }
  fillPicker(pickMain);
  fillPicker(pickBonus);

  function saveChoice(){
    try { localStorage.setItem(STORE, JSON.stringify(choice)); } catch (e){}
  }

  function takeChoice(c){
    if (!c) return;
    if (ITEMS[c.main])  choice.main  = c.main;
    if (ITEMS[c.bonus]) choice.bonus = c.bonus;
  }

  function loadChoice(){
    try { takeChoice(JSON.parse(localStorage.getItem(STORE) || "null")); } catch (e){}
    /* a scanned code brings the teacher's pick along, e.g. #main=ruler&bonus=pen */
    var m = location.hash.match(/main=([a-z0-9\-]+)/), b = location.hash.match(/bonus=([a-z0-9\-]+)/);
    if (m || b){
      takeChoice({ main:m && m[1], bonus:b && b[1] });
      saveChoice();
      try { if (history.replaceState) history.replaceState(null, "", location.pathname); } catch (e){}
    }
  }

  function openSettings(){
    stop();
    pickMain.value  = choice.main;
    pickBonus.value = choice.bonus;
    settingsSheet.classList.add("open");
  }

  function picked(){
    choice.main  = pickMain.value;
    choice.bonus = pickBonus.value;
    saveChoice();
    stop();
    showDialogue();
    fit();
  }
  pickMain.addEventListener("change", picked);
  pickBonus.addEventListener("change", picked);

  /* hold to open, so the children do not open it by accident */
  var gearHint  = document.getElementById("gearHint");
  var holdFrom  = null, hintTimer = null;

  function holdEnd(){
    if (holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
    holdFrom = null;
    gearBtn.classList.remove("holding");
  }

  function showHint(){
    gearHint.classList.add("show");
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(function(){ gearHint.classList.remove("show"); }, 1600);
  }

  gearBtn.addEventListener("pointerdown", function(e){
    e.preventDefault();
    if (holdTimer) return;
    try { gearBtn.setPointerCapture(e.pointerId); } catch (err){}
    holdFrom = { x:e.clientX, y:e.clientY };
    gearBtn.classList.add("holding");
    holdTimer = setTimeout(function(){
      holdTimer = null;
      holdEnd();
      gearHint.classList.remove("show");
      openSettings();
    }, HOLD_MS);
  });
  gearBtn.addEventListener("pointermove", function(e){
    if (holdFrom && Math.abs(e.clientX - holdFrom.x) + Math.abs(e.clientY - holdFrom.y) > 40) holdEnd();
  });
  gearBtn.addEventListener("pointerup", function(){
    if (holdTimer){ holdEnd(); showHint(); }
  });
  gearBtn.addEventListener("pointercancel", holdEnd);
  gearBtn.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openSettings(); }
  });

  /* only the cross closes it - lifting the finger after the hold lands on the
     dark background */
  document.getElementById("settingsClose").addEventListener("click", function(){
    settingsSheet.classList.remove("open");
  });

  /* ---------- start ---------- */

  loadChoice();
  showDialogue();

  /* ---------- share sheet ---------- */

  var shareSheet = document.getElementById("shareSheet");
  var qrCard     = document.getElementById("qrCard");
  var urlLine    = document.getElementById("urlLine");

  function pageUrl(){
    var web = location.protocol === "https:" || location.protocol === "http:";
    return web ? location.origin + location.pathname + "#main=" + choice.main + "&bonus=" + choice.bonus : "";
  }

  function qrSvg(text){
    var r;
    try { r = QR.encode(text, "M"); }
    catch (e){
      try { r = QR.encode(text, "L"); }
      catch (e2){ return "<p class='empty-note'>This address is too long for a code.</p>"; }
    }
    var q = 4, n = r.size, total = n + q * 2, d = "";
    for (var y = 0; y < n; y++)
      for (var x = 0; x < n; x++)
        if (r.modules[y][x]) d += "M" + (x + q) + " " + (y + q) + "h1v1h-1z";
    return '<svg viewBox="0 0 ' + total + ' ' + total + '" shape-rendering="crispEdges" ' +
           'xmlns="http://www.w3.org/2000/svg"><rect width="' + total + '" height="' + total +
           '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
  }

  document.getElementById("shareBtn").addEventListener("click", function(){
    var url = pageUrl();
    if (url){
      qrCard.innerHTML = qrSvg(url);
      urlLine.textContent = url;
    } else {
      qrCard.innerHTML = "<p class='empty-note'>Put the page online first - then this shows its code.</p>";
      urlLine.textContent = "";
    }
    shareSheet.classList.add("open");
  });
  document.getElementById("shareClose").addEventListener("click", function(){
    shareSheet.classList.remove("open");
  });
  shareSheet.addEventListener("click", function(e){
    if (e.target === shareSheet) shareSheet.classList.remove("open");
  });

  /* ---------- no zooming ---------- */

  /* Safari ignores user-scalable=no, so pinch and double-tap zoom are refused
     here instead. Scrolling up and down still works. */
  ["gesturestart","gesturechange","gestureend"].forEach(function(t){
    document.addEventListener(t, function(e){ e.preventDefault(); }, { passive:false });
  });
  document.addEventListener("dblclick", function(e){ e.preventDefault(); }, { passive:false });
  window.addEventListener("contextmenu", function(e){ e.preventDefault(); });

  /* ---------- fit the screen, also after turning the iPad ---------- */

  var MIN_SIZE = 16, MAX_SIZE = 44;      /* bubble text, px */

  function fits(){
    return scene.scrollHeight <= scene.clientHeight &&
           scene.scrollWidth  <= scene.clientWidth;
  }

  /* halve the gap until the largest size that fits is left */
  function fit(){
    var lo = MIN_SIZE, hi = MAX_SIZE;
    clearArrows();                     /* an old arrow must not get in the way */
    scene.style.fontSize = hi + "px";
    if (!fits()){
      for (var k = 0; k < 9; k++){
        var mid = (lo + hi) / 2;
        scene.style.fontSize = mid + "px";
        if (fits()) lo = mid; else hi = mid;
      }
      scene.style.fontSize = lo + "px";
    }
    drawArrows();
  }

  var fitQueued = false;
  function refit(){
    if (fitQueued) return;
    fitQueued = true;
    requestAnimationFrame(function(){ fitQueued = false; fit(); });
  }

  window.addEventListener("resize", refit);
  window.addEventListener("orientationchange", function(){ setTimeout(fit, 250); });
  Array.prototype.forEach.call(scene.querySelectorAll(".sprite img"), function(img){
    img.addEventListener("load", refit);
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  fit();

  /* ---------- offline storage ---------- */

  var VERSION = "v19";
  var statusEl = document.getElementById("status");
  var keptText = "";

  function showStatus(){
    var saved = ("serviceWorker" in navigator) && navigator.serviceWorker.controller;
    statusEl.textContent = VERSION + (saved ? " \u00B7 saved on this iPad" + keptText : "");
  }

  /* shown in the corner: ready for a lesson without internet? */
  function countKept(){
    if (!window.caches) return;
    var names = allClipNames(), found = 0, left = names.length;
    names.forEach(function(name){
      caches.match("./audio/" + name + ".mp3")
        .then(function(r){ return r || caches.match("./" + name + ".mp3"); })
        .then(function(r){ if (r) found++; })
        .catch(function(){})
        .then(function(){
          if (--left > 0) return;
          keptText = " \u00B7 " + found + " of " + names.length + " recordings";
          showStatus();
        });
    });
  }

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js", { scope:"./" })
        .then(showStatus)
        .catch(function(){ statusEl.textContent = VERSION; });
          if (navigator.serviceWorker.controller) setTimeout(function(){ keepAllClips(countKept); }, 1500);
    });
    /* on the first visit everything loads before the offline copy exists */
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      showStatus();
      findClips();
      keepAllClips(countKept);
      Object.keys(PEOPLE).forEach(function(key){
        if (PEOPLE[key].picture) fetch(PEOPLE[key].picture).catch(function(){});
      });
    });
  }
  showStatus();
})();
</script>
</body>
</html>
